[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-spider"
version = "1.0.0"
description = "Web-based SEO auditing tool similar to Screaming Frog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "selectolax>=0.3.17",
    "lxml>=5.1.0",
    "tldextract>=5.1.1",
    "pydantic>=2.5.3",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
]

[tool.setuptools]
packages = ["backend", "backend.models", "backend.crawler", "backend.analyzers", "backend.api", "backend.services"]

[tool.setuptools.package-data]
backend = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"
